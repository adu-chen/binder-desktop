[package]
name = "binder"
version = "0.1.0"
description = "Binder — 本地优先的 AI 原生写作工作台"
edition = "2021"
rust-version = "1.77"

[lib]
name = "binder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# workspace.db 持久化（PI-SYS-03）。bundled：自带 sqlite C 库，免系统依赖。
rusqlite = { version = "0.32", features = ["bundled"] }
# 目录选择器（PI-FE-00）：欢迎页"打开/新建 workspace"经此选目录后调 ws.open_workspace。
tauri-plugin-dialog = "2"
# PI-AG-WIRE-01：调本地 dev AI 网关（HTTP + 流式 SSE）。default-features=false 仅 http（客户端只连 localhost GW，
# 不直连 provider https，X-FORBID-001）；正式版迁独立仓时按需补 TLS。
reqwest = { version = "0.12", default-features = false, features = ["json", "stream"] }
futures-util = "0.3"
# 不透明 ID 生成（G-4 定档，A-CORE-X-R-03 §7）：workspace/diff/payload ID = 前缀 + UUIDv4。
uuid = { version = "1", features = ["v4"] }
# xlsx/xls 表格数据解析（PRV 表格预览 · 2026-07-03 #1）：二进制解析置于 DOC 管线（X-SEQ-004 合规，
# 前端不内置解析库）；只读取值供表格式预览（BR-PRV-DATA-001 只读硬边界）。
calamine = "0.30.1"
# 包内 Pandoc / LibreOffice 清单的 SHA-256 校验（DOC-BUNDLED-RUNTIME-01）。
sha2 = "0.10"
# S0 Font Trace：只读检查 DOCX/PPTX 包内 OOXML，不解压、不修改用户源文件。
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
quick-xml = "0.31.0"
# 本地字体库只读枚举（ED-FONT-LOCAL-LIBRARY-01）：macOS CoreText 族名枚举，仅 macOS 使用。
core-foundation = { version = "0.10", default-features = false }
core-text = "19.2"

# 测试期启用 tauri mock 运行时（A-CORE-X-L-04 验证：状态机广播 emit→listen 回路）。
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
filetime = "0.2"
