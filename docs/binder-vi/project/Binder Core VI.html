<title>Binder Core · Visual Identity</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Serif+SC:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  /* utility classes used across artboards */
  .mono   { font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace; }
  .sans   { font-family: 'Inter', 'IBM Plex Sans', system-ui, sans-serif; }
  .sc     { font-family: 'Noto Sans SC', system-ui, sans-serif; }
  .scserif{ font-family: 'Noto Serif SC', serif; }
  .serif  { font-family: 'Instrument Serif', 'Noto Serif SC', serif; }
  .tnum   { font-variant-numeric: tabular-nums; }

  /* shared muted-grid bg, used in some artboards */
  .gridbg {
    background-image:
      linear-gradient(to right, rgba(0,0,0,0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.05) 1px, transparent 1px);
    background-size: 32px 32px;
  }
</style>
</head>
