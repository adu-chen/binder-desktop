  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;binder-product-functional-breakdown&quot;&gt;
  &lt;style&gt;
    #binder-product-functional-breakdown {
      --pfd-component: var(--viz-series-2);
      --pfd-function: var(--viz-series-3);
      --pfd-chain: var(--viz-series-1);
      color: var(--foreground);
      width: 100%;
    }

    #binder-product-functional-breakdown * { box-sizing: border-box; }

    #binder-product-functional-breakdown .pfd-legend,
    #binder-product-functional-breakdown .pfd-chain-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px 16px;
    }

    #binder-product-functional-breakdown .pfd-legend { margin-bottom: 14px; color: var(--muted-foreground); }
    #binder-product-functional-breakdown .pfd-legend-item { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
    #binder-product-functional-breakdown .pfd-key-component,
    #binder-product-functional-breakdown .pfd-key-function,
    #binder-product-functional-breakdown .pfd-key-state { display: inline-block; flex: 0 0 auto; }
    #binder-product-functional-breakdown .pfd-key-component { width: 22px; height: 14px; border: 2px solid var(--pfd-component); background: color-mix(in srgb, var(--pfd-component) 10%, transparent); }
    #binder-product-functional-breakdown .pfd-key-function { width: 22px; height: 14px; border: 1px solid color-mix(in srgb, var(--pfd-function) 68%, var(--border)); border-radius: 4px; background: color-mix(in srgb, var(--pfd-function) 18%, var(--card)); }
    #binder-product-functional-breakdown .pfd-key-state { width: 22px; height: 10px; border-left: 1px solid var(--muted-foreground); border-bottom: 1px solid var(--muted-foreground); }
    #binder-product-functional-breakdown .pfd-key-chain { width: 30px; border-top: 3px solid var(--pfd-chain); position: relative; }
    #binder-product-functional-breakdown .pfd-key-chain::after { content: &quot;&quot;; position: absolute; right: -1px; top: -5px; width: 8px; height: 8px; border-top: 1px solid var(--pfd-chain); border-right: 1px solid var(--pfd-chain); transform: rotate(45deg); }

    #binder-product-functional-breakdown .pfd-map {
      display: grid;
      grid-template-columns: minmax(280px, .39fr) minmax(480px, .61fr);
      gap: 22px;
      align-items: start;
    }

    #binder-product-functional-breakdown .pfd-tree-pane { min-width: 0; padding-right: 20px; border-right: 1px solid var(--border); }
    #binder-product-functional-breakdown .pfd-matrix-pane { min-width: 0; }
    #binder-product-functional-breakdown .pfd-pane-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    #binder-product-functional-breakdown .pfd-pane-head strong { font-weight: 500; }

    #binder-product-functional-breakdown .pfd-root {
      border: 2px solid var(--pfd-component);
      background: color-mix(in srgb, var(--pfd-component) 6%, transparent);
      padding: 12px;
    }

    #binder-product-functional-breakdown .pfd-root-label,
    #binder-product-functional-breakdown .pfd-component-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    #binder-product-functional-breakdown code { color: var(--muted-foreground); }
    #binder-product-functional-breakdown .pfd-tree,
    #binder-product-functional-breakdown .pfd-tree ul { list-style: none; padding: 0; margin: 0; }
    #binder-product-functional-breakdown .pfd-tree &gt; li + li { margin-top: 8px; }
    #binder-product-functional-breakdown .pfd-tree ul { margin: 5px 0 0 14px; padding-left: 14px; border-left: 1px solid var(--muted-foreground); }
    #binder-product-functional-breakdown .pfd-tree ul[hidden] { display: none; }
    #binder-product-functional-breakdown .pfd-tree li { position: relative; }
    #binder-product-functional-breakdown .pfd-tree ul &gt; li { padding-top: 5px; }
    #binder-product-functional-breakdown .pfd-tree ul &gt; li::before { content: &quot;&quot;; position: absolute; width: 10px; left: -14px; top: 20px; border-top: 1px solid var(--muted-foreground); }

    #binder-product-functional-breakdown .pfd-node {
      width: 100%;
      justify-content: flex-start;
      text-align: left;
      color: var(--foreground);
      background: color-mix(in srgb, var(--pfd-function) 15%, var(--card));
      border-color: color-mix(in srgb, var(--pfd-function) 64%, var(--border));
    }

    #binder-product-functional-breakdown .pfd-node[data-depth=&quot;1&quot;] { font-weight: 500; }
    #binder-product-functional-breakdown .pfd-node .pfd-caret { color: var(--muted-foreground); width: 13px; flex: 0 0 13px; }
    #binder-product-functional-breakdown .pfd-node .pfd-node-label { min-width: 0; overflow-wrap: anywhere; }
    #binder-product-functional-breakdown .pfd-node .pfd-release { margin-left: auto; color: var(--muted-foreground); font-weight: 400; white-space: nowrap; }

    #binder-product-functional-breakdown .pfd-matrix-shell {
      border: 2px solid var(--pfd-component);
      background: color-mix(in srgb, var(--pfd-component) 5%, transparent);
      padding: 12px;
    }

    #binder-product-functional-breakdown .pfd-surface-grid {
      display: grid;
      grid-template-columns: minmax(125px, .95fr) minmax(360px, 4.5fr) minmax(125px, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    #binder-product-functional-breakdown .pfd-surface,
    #binder-product-functional-breakdown .pfd-wb-shell {
      border: 1.5px solid color-mix(in srgb, var(--pfd-component) 72%, var(--border));
      background: color-mix(in srgb, var(--pfd-component) 7%, var(--background));
      padding: 10px;
      min-width: 0;
    }

    #binder-product-functional-breakdown .pfd-wb-lanes {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
    }

    #binder-product-functional-breakdown .pfd-lane {
      min-width: 0;
      padding-left: 8px;
      border-left: 1px solid color-mix(in srgb, var(--pfd-component) 50%, var(--border));
    }

    #binder-product-functional-breakdown .pfd-lane:first-child { border-left: 0; padding-left: 0; }
    #binder-product-functional-breakdown .pfd-lane-title { margin: 0 0 8px; color: var(--muted-foreground); }
    #binder-product-functional-breakdown .pfd-slot { width: 100%; justify-content: flex-start; text-align: left; color: var(--foreground); background: color-mix(in srgb, var(--pfd-function) 14%, var(--card)); border-color: color-mix(in srgb, var(--pfd-function) 58%, var(--border)); }
    #binder-product-functional-breakdown .pfd-slot + .pfd-slot { margin-top: 7px; }

    #binder-product-functional-breakdown .pfd-chain-row { margin-top: 13px; padding-top: 11px; border-top: 3px solid var(--pfd-chain); }
    #binder-product-functional-breakdown .pfd-chain { color: var(--foreground); background: color-mix(in srgb, var(--pfd-chain) 12%, var(--card)); border-color: color-mix(in srgb, var(--pfd-chain) 62%, var(--border)); }
    #binder-product-functional-breakdown .pfd-chain::before { content: &quot;↝&quot;; color: var(--pfd-chain); margin-right: 7px; }

    #binder-product-functional-breakdown .pfd-detail { margin-top: 18px; }
    #binder-product-functional-breakdown .pfd-detail-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; margin-bottom: 14px; }
    #binder-product-functional-breakdown .pfd-detail-head strong { font-weight: 500; }
    #binder-product-functional-breakdown .pfd-detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
    #binder-product-functional-breakdown .pfd-detail-group h3 { margin: 0 0 8px; font-weight: 500; }
    #binder-product-functional-breakdown .pfd-detail-group dl { display: grid; grid-template-columns: minmax(52px, auto) 1fr; gap: 6px 9px; margin: 0; }
    #binder-product-functional-breakdown .pfd-detail-group dt { color: var(--muted-foreground); }
    #binder-product-functional-breakdown .pfd-detail-group dd { margin: 0; overflow-wrap: anywhere; }

    @media (max-width: 960px) {
      #binder-product-functional-breakdown .pfd-map { grid-template-columns: 1fr; }
      #binder-product-functional-breakdown .pfd-tree-pane { padding: 0 0 18px; border-right: 0; border-bottom: 1px solid var(--border); }
    }

    @media (max-width: 760px) {
      #binder-product-functional-breakdown .pfd-surface-grid { grid-template-columns: 1fr; }
      #binder-product-functional-breakdown .pfd-wb-lanes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #binder-product-functional-breakdown .pfd-lane:nth-child(odd) { border-left: 0; padding-left: 0; }
    }

    @media (max-width: 460px) {
      #binder-product-functional-breakdown .pfd-wb-lanes { grid-template-columns: 1fr; }
      #binder-product-functional-breakdown .pfd-lane { border-left: 0; padding-left: 0; padding-top: 8px; border-top: 1px solid var(--border); }
      #binder-product-functional-breakdown .pfd-lane:first-child { border-top: 0; padding-top: 0; }
    }

      const chains = {

      const index = new Map();
      function walk(nodes, parent = &#x27;Binder 产品能力&#x27;, inheritedSlots = []) {

      function renderNodes(nodes, depth = 1) {

      root.querySelectorAll(&#x27;[data-select]&#x27;).forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; select(button.dataset.select)));

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };

    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
